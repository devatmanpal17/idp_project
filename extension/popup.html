<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChaiGaram</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="appbar">
        <button id="back" class="icon-button" title="Go back to the previous page" aria-label="Go back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <div class="brand">
          <span class="mark">CG</span>
          <div><strong>ChaiGaram</strong><small>Learning companion</small></div>
        </div>
        <button id="options" class="icon-button" title="Connection settings" aria-label="Connection settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1.4 1.6h-4A1.7 1.7 0 0 0 8 19.4a1.7 1.7 0 0 0-1.88.34l-2.83-2.83A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3 13.6v-3.2A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l2.83-2.83A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10.4 3h3.2A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l2.83 2.83A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.6 1.4v3.2A1.7 1.7 0 0 0 19.4 15Z" /></svg>
        </button>
      </header>

      <section id="status" class="status checking" aria-live="polite">
        <span class="status-dot"></span>
        <div><small>Study engine</small><span id="statusText">Checking connection...</span></div>
      </section>

      <section class="hero">
        <span class="eyebrow">On this page</span>
        <h1>Turn browsing into understanding.</h1>
        <p>Open your private tutor, summary, and English quiz workspace without leaving the lesson.</p>
        <button id="open" class="primary">
          <span>Open study sidekick</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </section>

      <section class="quick-actions" aria-label="Page actions">
        <button id="capturePage" class="action-card">
          <span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5Z" /><path d="M14 3v6h6M8 13h8M8 17h5" /></svg></span>
          <span><strong>Learn page</strong><small>Capture readable content</small></span>
        </button>
        <button id="capture" class="action-card">
          <span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v4M15 4h4a2 2 0 0 1 2 2v4M9 20H5a2 2 0 0 1-2-2v-4M15 20h4a2 2 0 0 0 2-2v-4M7 12h10" /></svg></span>
          <span><strong>Save selection</strong><small>Keep highlighted text</small></span>
        </button>
      </section>

      <button id="dashboard" class="dashboard">
        <span><small>Your learning command center</small><strong>Open dashboard</strong></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M10 14 19 5M19 14v5H5V5h5" /></svg>
      </button>
    </main>
    <script src="connection.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
