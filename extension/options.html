<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>ChaiGaram Settings</title><link rel="stylesheet" href="options.css" /></head>
  <body>
    <main>
      <h1>ChaiGaram connection</h1>
      <p>Connect any learning webpage to your private, locally running study engine.</p>
      <label>Backend URL<input id="apiBaseUrl" type="url" placeholder="http://localhost:8000" /></label>
      <label class="check"><input id="autoCapture" type="checkbox" /> Automatically capture visible captions when a page has learning media</label>
      <button id="save">Save and test</button>
      <div id="result" aria-live="polite"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
